<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FORCE SCHEDULE — 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=Cabinet+Grotesk:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1e2631;--surface3:#252f3e;--border:#253040;--border2:#304055;--border3:#3d5068;--text:#e8f0f8;--text-dim:#7a9ab8;--text-muted:#3d5870;--green:#3dffa0;--green-dim:rgba(61,255,160,0.12);--green-glow:rgba(61,255,160,0.3);--amber:#ffc94d;--amber-dim:rgba(255,201,77,0.12);--red:#ff5c7a;--red-dim:rgba(255,92,122,0.14);--blue:#4dc8ff;--purple:#b87aff;--purple-dim:rgba(184,122,255,0.12);--teal:#30e8d8;--c-progro:#3dffa0;--c-fhg:#ffc94d;--c-pa:#4dc8ff;--c-t1:#ff5c7a;--c-ct:#b87aff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Cabinet Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(61,255,160,0.06) 1px,transparent 1px);background-size:32px 32px}
.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:24px 14px 40px}

/* HEADER */
header{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
header::after{content:'';display:block;height:1px;background:linear-gradient(90deg,var(--green) 0%,transparent 60%);margin-top:20px;opacity:0.35}
.header-inner{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px}
.brand-top{display:flex;flex-direction:column;line-height:1}
.word-force{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(44px,7vw,80px);color:var(--green);letter-spacing:-2px;line-height:0.9;text-shadow:0 0 30px var(--green-glow)}
.word-schedule{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(44px,7vw,80px);color:var(--text);letter-spacing:-2px;line-height:0.9}
.brand-sub{font-family:'Syne Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:4px;text-transform:uppercase;margin-top:7px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.last-updated{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;text-align:right}
.last-updated span{color:var(--text-dim)}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase}
.leg-pip{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MONTH SWITCHER */
.month-switcher{display:flex;align-items:center;gap:0;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;width:fit-content}
.month-btn{font-family:'Syne Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:10px 20px;background:none;border:none;color:var(--text-muted);cursor:pointer;transition:all .15s;border-right:1px solid var(--border)}
.month-btn:last-child{border-right:none}
.month-btn:hover{color:var(--text);background:var(--surface2)}
.month-btn.active{color:var(--green);background:var(--green-dim);font-weight:600}

/* LOADING */
.loading-state{display:flex;align-items:center;justify-content:center;padding:80px 20px;flex-direction:column;gap:16px}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'Syne Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
.error-state{padding:40px;text-align:center;font-family:'Syne Mono',monospace;font-size:11px;color:var(--red);letter-spacing:2px;text-transform:uppercase}

/* CALENDAR */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.day-heads{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--border)}
.day-head{font-family:'Syne Mono',monospace;font-size:8px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);padding:12px 8px;text-align:center;border-right:1px solid var(--border)}
.day-head:last-child{border-right:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:clamp(80px,12vw,120px);padding:9px 7px;position:relative;transition:background .15s;cursor:default}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.has-data{cursor:pointer}
.cal-cell.has-data:hover{background:var(--surface2)}
.cal-cell.empty{background:rgba(0,0,0,0.2)}
.cal-cell.outside-month{opacity:0.28}
.cal-cell.today{background:linear-gradient(135deg,rgba(61,255,160,0.07),rgba(61,255,160,0.02))}
.cal-cell.today::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent)}
.cal-cell.over{background:linear-gradient(135deg,rgba(255,92,122,0.1),rgba(255,92,122,0.03))}
.cal-cell.over::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),transparent)}
.cal-cell.ct-exact{background:linear-gradient(135deg,rgba(255,201,77,0.06),transparent)}
.cal-cell.ct-exact::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),transparent);opacity:0.5}
.cell-date{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(16px,3vw,21px);color:var(--text-dim);line-height:1;margin-bottom:6px;letter-spacing:-0.5px}
.cal-cell.today .cell-date{color:var(--green);text-shadow:0 0 10px var(--green-glow)}
.cal-cell.over .cell-date{color:var(--red)}
.fac-bars{display:flex;flex-direction:column;gap:3px}
.fac-row{display:flex;align-items:center;gap:4px}
.fac-lbl{font-family:'Syne Mono',monospace;font-size:7px;color:var(--text-muted);letter-spacing:1px;width:28px;flex-shrink:0}
.fac-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.fac-fill{height:100%;border-radius:2px}
.fac-num{font-family:'Syne Mono',monospace;font-size:7px;color:var(--text-dim);width:12px;text-align:right;flex-shrink:0}
.over-badge{position:absolute;bottom:4px;right:5px;font-family:'Syne Mono',monospace;font-size:7px;color:var(--red);background:var(--red-dim);border:1px solid rgba(255,92,122,0.25);border-radius:3px;padding:1px 4px;letter-spacing:1px}
.view-hint{position:absolute;bottom:4px;right:5px;font-family:'Syne Mono',monospace;font-size:7px;color:var(--text-muted);opacity:0;transition:opacity .15s;pointer-events:none}
.cal-cell.has-data:hover .view-hint{opacity:1}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(5,8,12,0.9);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
@media(min-width:600px){.overlay{align-items:center;padding:20px}}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.85,.3,1)}
@media(min-width:600px){.modal{border-radius:14px;transform:translateY(16px)}}
.overlay.open .modal{transform:translateY(0)}
.drag-pill{width:34px;height:4px;background:var(--border3);border-radius:2px;margin:11px auto 0}
@media(min-width:600px){.drag-pill{display:none}}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:center;justify-content:space-between}
.modal-date{font-family:'Syne',sans-serif;font-weight:800;font-size:34px;color:var(--green);line-height:1;letter-spacing:-1px}
.modal-dayname{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;margin-top:3px}
.modal-status{font-family:'Syne Mono',monospace;font-size:9px;letter-spacing:1.5px;padding:5px 11px;border-radius:20px;font-weight:600;white-space:nowrap}
.modal-status.ok{color:var(--green);background:var(--green-dim);border:1px solid rgba(61,255,160,.2)}
.modal-status.over{color:var(--red);background:var(--red-dim);border:1px solid rgba(255,92,122,.2)}
.modal-status.exact{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(255,201,77,.2)}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Syne Mono',monospace;transition:all .15s;margin-left:8px;flex-shrink:0}
.modal-close:hover{background:var(--border2);color:var(--text)}
.modal-body{padding:16px 20px 24px;display:flex;flex-direction:column;gap:9px}
.fac-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.fac-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
.fac-name-row{display:flex;align-items:center;gap:7px;font-family:'Syne Mono',monospace;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.fac-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fac-count-big{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-1px}
.count-ctrl{display:flex;align-items:center;gap:5px}
.ctrl-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:var(--surface3);color:var(--text-dim);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none;font-family:'Syne Mono',monospace;flex-shrink:0}
.ctrl-btn:hover{border-color:var(--border3);color:var(--text)}
.ctrl-btn:active{transform:scale(.88)}
.ctrl-num{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--text);min-width:34px;text-align:center;background:none;border:none;outline:none;cursor:text;line-height:1}
.ctrl-num:focus{color:var(--amber)}
.fac-card-body{padding:0 14px 12px}
.task-lbl{font-family:'Syne Mono',monospace;font-size:8px;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:5px}
.task-text{font-family:'Cabinet Grotesk',sans-serif;font-size:13px;color:var(--text-dim);line-height:1.5}
.task-input{width:100%;background:var(--surface3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-size:13px;padding:8px 11px;outline:none;resize:none;transition:border-color .15s;min-height:36px;line-height:1.5}
.task-input:focus{border-color:var(--border3)}
.info-pill{font-family:'Syne Mono',monospace;font-size:9px;padding:6px 10px;border-radius:6px;letter-spacing:1px}
.info-amber{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(255,201,77,.2)}
.balance-wrap{padding:3px 0}
.balance-hdr{display:flex;justify-content:space-between;font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase}
.balance-track{height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.balance-fill{height:100%;border-radius:4px;transition:width .3s,background .3s}
.notes-lbl{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:5px}
.notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-size:13px;padding:9px 12px;outline:none;resize:none;transition:border-color .15s;min-height:48px}
.notes-input:focus{border-color:var(--border3)}
.admin-note{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:8px 0}
.btn-save{width:100%;padding:14px;background:var(--green);color:#000;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;transition:all .15s;margin-top:4px}
.btn-save:hover{background:#5fffb3;transform:translateY(-1px)}
.btn-save:active{transform:translateY(0)}
.btn-save:disabled{background:var(--border2);color:var(--text-muted);cursor:not-allowed;transform:none}
.save-status{font-family:'Syne Mono',monospace;font-size:9px;text-align:center;letter-spacing:2px;text-transform:uppercase;padding:4px 0;min-height:20px}

/* CHANGE LOG */
.log-toggle{display:flex;align-items:center;gap:10px;margin-top:16px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;width:100%;transition:border-color .15s}
.log-toggle:hover{border-color:var(--border2)}
.log-lbl{font-family:'Syne Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;flex:1}
.log-count{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--amber);line-height:1}
.log-arrow{font-family:'Syne Mono',monospace;font-size:11px;color:var(--text-muted);transition:transform .2s}
.log-arrow.open{transform:rotate(180deg)}
.log-panel{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:0;overflow:hidden;transition:max-height .3s ease}
.log-panel.open{max-height:480px;overflow-y:auto}
.log-empty{padding:28px;text-align:center;font-family:'Syne Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
.log-entry{padding:12px 18px;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.log-entry-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.log-edate{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--green);letter-spacing:-0.5px}
.log-ts{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:1px}
.log-change{font-family:'Syne Mono',monospace;font-size:9px;letter-spacing:1px}
.log-task{font-family:'Cabinet Grotesk',sans-serif;font-size:12px;color:var(--text-dim)}
.log-note{font-family:'Cabinet Grotesk',sans-serif;font-size:11px;color:var(--amber);font-style:italic;margin-top:2px}

/* BOTTOM BAR */
.bottom-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.pool-block{display:flex;flex-direction:column;gap:5px;opacity:0.35;pointer-events:none;transition:opacity .25s}
.pool-block.unlocked{opacity:1;pointer-events:auto}
.pool-lbl{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase}
.pool-row{display:flex;align-items:center;gap:7px}
.pool-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);color:var(--text-dim);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none}
.pool-btn:hover{border-color:var(--green);color:var(--green)}
.pool-btn:active{transform:scale(.9)}
.pool-num{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;color:var(--green);line-height:1;min-width:40px;text-align:center;background:none;border:none;outline:none;cursor:text;text-shadow:0 0 16px var(--green-glow)}
.pool-num:focus{color:var(--amber);text-shadow:none}
.btn-admin{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text-dim);cursor:pointer;font-family:'Syne Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .15s;white-space:nowrap}
.btn-admin:hover{border-color:var(--border3);color:var(--text)}
.btn-admin.active{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.admin-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;transition:all .2s}
.btn-admin.active .admin-dot{background:var(--green);box-shadow:0 0 7px var(--green-glow)}

/* PIN */
.pin-overlay{position:fixed;inset:0;background:rgba(5,8,12,.92);backdrop-filter:blur(12px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.pin-overlay.open{opacity:1;pointer-events:all}
.pin-modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:290px;padding:32px 22px 26px;display:flex;flex-direction:column;align-items:center;transform:scale(.95);transition:transform .2s cubic-bezier(.2,.85,.3,1)}
.pin-overlay.open .pin-modal{transform:scale(1)}
.pin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;color:var(--text);letter-spacing:-1px;margin-bottom:3px}
.pin-sub{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;text-align:center;min-height:14px}
.pin-dots{display:flex;gap:12px;margin-bottom:24px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border3);transition:all .12s}
.pin-dot.filled{background:var(--green);border-color:var(--green);box-shadow:0 0 8px var(--green-glow)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}
.pin-btn{aspect-ratio:1;border-radius:11px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:'Syne',sans-serif;font-weight:700;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;user-select:none}
.pin-btn:hover{background:var(--surface3);border-color:var(--border3)}
.pin-btn:active{transform:scale(.88)}
.pin-btn.wide{grid-column:span 2;aspect-ratio:auto;padding:14px}
.pin-btn.del{font-size:17px;color:var(--text-dim)}
.pin-error{font-family:'Syne Mono',monospace;font-size:9px;color:var(--red);letter-spacing:2px;text-transform:uppercase;margin-top:14px;min-height:14px;text-align:center}
.pin-links{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:12px}
.pin-link{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2px;background:none;border:none;cursor:pointer;text-decoration:underline;text-transform:uppercase}
.pin-link:hover{color:var(--text-dim)}

/* MOBILE */
@media(max-width:480px){.app{padding:12px 8px 36px}.cal-cell{min-height:64px;padding:5px 3px}.cell-date{font-size:13px;margin-bottom:3px}.fac-lbl{display:none}.fac-num{font-size:7px;width:10px}.day-head{font-size:7px;padding:9px 2px;letter-spacing:1px}.word-force,.word-schedule{font-size:38px}.month-btn{padding:8px 12px;font-size:9px}}


/* ── PRODUCT ARRIVALS ── */
.arrival-pills{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.arrival-pill{font-family:'Syne Mono',monospace;font-size:6.5px;letter-spacing:0.5px;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.arrival-pill-progro{color:var(--c-progro);background:var(--green-dim);border:1px solid rgba(61,255,160,0.2)}
.arrival-pill-fhg{color:var(--c-fhg);background:var(--amber-dim);border:1px solid rgba(255,201,77,0.2)}
.arrival-pill-pa{color:var(--c-pa);background:rgba(77,200,255,0.12);border:1px solid rgba(77,200,255,0.2)}
.arrival-modal-section{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.arrival-modal-title{font-family:'Syne Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:2px}
.arrival-modal-item{display:flex;align-items:center;gap:8px;font-family:'Cabinet Grotesk',sans-serif;font-size:13px;color:var(--text)}
.arrival-modal-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-inner">
      <div class="brand">

const SUPABASE_URL = 'https://uxhrqnmyzaxtuirzfapa.supabase.co';

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    mode: 'cors',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Accept': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    }
  });
  if (!res.ok) {
    const err = await res.text();
    console.error('Supabase response:', res.status, res.headers.get('content-type'), err);
    throw new Error(`Supabase error: ${res.status} ${err}`);
  }
  console.log('Supabase OK:', res.status, path);

// ── CONSTANTS ──

// ── STATE ──

// ── SUPABASE API ──
async function fetchSchedule(month) {
  const rows = await sbFetch(`schedules?month=eq.${month}&order=date.asc`);
  const result = {};
  for (const row of rows) {
    result[row.date] = {
      progro: row.progro, fhg: row.fhg, pa: row.pa, t1: row.t1, ct: row.ct,
      tasks: { progro: row.task_progro, fhg: row.task_fhg, pa: row.task_pa, t1: row.task_t1 }
    };
  }
  return result;
}

async function fetchSettings() {
  const rows = await sbFetch('settings?select=key,value');
  const s = {};
  for (const r of rows) s[r.key] = r.value;
  return s;
}

async function saveScheduleRow(date, data) {
  const month = date.slice(0, 7);
  await sbFetch('schedules?date=eq.' + date, {
    method: 'PATCH',
    prefer: 'return=minimal',
    body: JSON.stringify({
      progro: data.progro, fhg: data.fhg, pa: data.pa, t1: data.t1, ct: data.ct,
      task_progro: data.tasks.progro, task_fhg: data.tasks.fhg,
      task_pa: data.tasks.pa, task_t1: data.tasks.t1,
      updated_at: new Date().toISOString()
    })
  });
}

async function saveChangeLogEntry(entry) {
  for (const c of entry.changes) {
    await sbFetch('change_log', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        date_changed: entry.date_iso,
        facility: c.fac,
        old_value: String(c.old),
        new_value: String(c.new),
        note: entry.note || ''
      })
    });
  }
}

async function fetchChangeLog(month) {
  const startDate = month + '-01';
  const [yr, mo] = month.split('-').map(Number);
  const endDate = new Date(yr, mo, 0).toISOString().split('T')[0]; // last day of month
  const rows = await sbFetch(`change_log?date_changed=gte.${startDate}&date_changed=lte.${endDate}&order=changed_at.desc&limit=100`);
  return rows.map(r => ({
    ts: new Date(r.changed_at).toLocaleString('en-US', {month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}),
    date: new Date(r.date_changed + 'T12:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric'}),
    changes: [{fac: r.facility, old: r.old_value, new: r.new_value, isTask: isNaN(Number(r.old_value))}],
    note: r.note
  }));
}

async function saveSetting(key, value) {

    prefer: 'return=minimal',

async function init() {
  buildLegend();

  await loadMonth(currentMonth);

}

async function loadMonth(month) {
  currentMonth = month;
  updateMonthSwitcher();
  showLoading();
  try {
    scheduleData = await fetchSchedule(month);
    // Also load surrounding month padding days
    const prevMonth = getPrevMonth(month);
    const nextMonth = getNextMonth(month);
    try {
      const prev = await fetchSchedule(prevMonth);
      const next = await fetchSchedule(nextMonth);
      Object.assign(scheduleData, prev, next);
    } catch(e) {}
    buildCalendar(month);
    setTimestamp();
    // Reload change log for this month
    try {
      changeLog = await fetchChangeLog(month);
      renderLog();
    } catch(e) { console.error('Change log fetch failed:', e); }
  } catch(e) {
    showError('Failed to load schedule. Check your connection.');
    console.error(e);
  }
}

function getPrevMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return mo === 1 ? `${y-1}-12` : `${y}-${String(mo-1).padStart(2,'0')}`;
}
function getNextMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return mo === 12 ? `${y+1}-01` : `${y}-${String(mo+1).padStart(2,'0')}`;
}

function showLoading() {

// ── CT CALC ──
function ctVal(ds) {
  const d = scheduleData[ds];
  if (!d) return totalPool;
  return totalPool - FAC_CONFIG.filter(f => f.key !== 'ct').reduce((s, f) => s + (d[f.key] || 0), 0);
}

// ── CALENDAR ──
function buildCalendar(month) {
  const [yr, mo] = month.split('-').map(Number);

  // Find the Monday on or before the 1st of the month
  const firstDay = new Date(yr, mo - 1, 1);
  const lastDay = new Date(yr, mo, 0);

  // Start from Monday of the week containing the 1st
  const start = new Date(firstDay);
  const dow = start.getDay(); // 0=Sun
  const offset = dow === 0 ? 6 : dow - 1;
  start.setDate(start.getDate() - offset);

  // End on Sunday of the week containing the last day
  const end = new Date(lastDay);
  const endDow = end.getDay();
  const endOffset = endDow === 0 ? 0 : 7 - endDow;
  end.setDate(end.getDate() + endOffset);

  const today = new Date(); today.setHours(0,0,0,0);

  const container = document.getElementById('calContainer');
  container.innerHTML = `
    <div class="cal-wrap">
      <div class="day-heads">
        <div class="day-head">MON</div><div class="day-head">TUE</div>
        <div class="day-head">WED</div><div class="day-head">THU</div>
        <div class="day-head">FRI</div><div class="day-head">SAT</div>
        <div class="day-head">SUN</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>`;

  const grid = document.getElementById('calGrid');
  let d = new Date(start);

  while (d <= end) {
    const ds = d.toISOString().split('T')[0];
    const data = scheduleData[ds];
    const isCurrentMonth = d.getMonth() === mo - 1;
    const isToday = d.getTime() === today.getTime();
    const cv = data ? ctVal(ds) : totalPool;
    const isOver = cv < 0;
    const isExact = cv === 0;

    const cell = document.createElement('div');
    const cellArrivals = ARRIVALS[ds] || [];

    cell.className = ['cal-cell',
      data ? 'has-data' : 'empty',
      !isCurrentMonth ? 'outside-month' : '',
      isToday ? 'today' : '',
      isOver ? 'over' : (isExact && data ? 'ct-exact' : '')
    ].filter(Boolean).join(' ');

    const dayNum = d.getDate();
    const dateLabel = dayNum === 1
      ? `${MONTHS_LABEL[d.getMonth()]} 1`
      : `${dayNum}`;

    if (data) {
      const bars = FAC_CONFIG.filter(f => f.key !== 'ct' && (data[f.key] || 0) > 0).map(f => {
        const pct = Math.min((data[f.key] / 30) * 100, 100);
        return `<div class="fac-row">
          <div class="fac-lbl">${f.label}</div>
          <div class="fac-track"><div class="fac-fill" style="width:${pct}%;background:${f.color}"></div></div>
          <div class="fac-num">${data[f.key]}</div>
        </div>`;
      }).join('');

      const ctc = cv < 0 ? 'var(--red)' : cv === 0 ? 'var(--amber)' : 'var(--c-ct)';
      const ctpct = Math.max(0, Math.min(cv / totalPool * 100, 100));
      const ctbar = `<div class="fac-row">
        <div class="fac-lbl" style="color:var(--c-ct)">CT</div>
        <div class="fac-track"><div class="fac-fill" style="width:${ctpct}%;background:${ctc}"></div></div>
        <div class="fac-num" style="color:${ctc}">${cv}</div>
      </div>`;

      // Build arrival pills
      const arrPills = cellArrivals.map(a => {
        const cls = a.source.toLowerCase() === 'progro' ? 'progro' : a.source.toLowerCase() === 'fhg' ? 'fhg' : 'pa';
        return `<div class="arrival-pill arrival-pill-${cls}">${a.source} ${a.room}</div>`;
      }).join('');

      cell.innerHTML = `
        <div class="cell-date">${dateLabel}</div>
        <div class="fac-bars">${bars}${ctbar}</div>
        ${arrPills ? `<div class="arrival-pills">${arrPills}</div>` : ''}
        ${isOver
          ? `<div class="over-badge">OVER ${Math.abs(cv)}</div>`
          : `<div class="view-hint">${adminUnlocked ? '▸ EDIT' : '▸ VIEW'}</div>`}`;

      const _ds = ds;
      cell.addEventListener('click', () => openModal(_ds, new Date(_ds + 'T12:00:00')));
    } else {
      cell.innerHTML = `<div class="cell-date">${dateLabel}</div>`;
    }

    grid.appendChild(cell);
    d.setDate(d.getDate() + 1);
  }
}

// ── MODAL ──
function openModal(ds, dateObj) {
  activeDate = ds;
  modalEdits = JSON.parse(JSON.stringify(scheduleData[ds]));
  const month = MONTHS_LABEL[dateObj.getMonth()];
  const day = dateObj.getDate();
  const dayName = DAYNAMES[dateObj.getDay()];
  const cv = ctVal(ds);
  const sc = cv < 0 ? 'over' : cv === 0 ? 'exact' : 'ok';
  const st = cv < 0 ? `OVER BY ${Math.abs(cv)}` : cv === 0 ? 'EXACT — CT CLOSED' : `CT: ${cv} AVAIL`;

  document.getElementById('modalHdr').innerHTML = `
    <div>
      <div class="modal-date">${month} ${day}</div>
      <div class="modal-dayname">${dayName.toUpperCase()} · ${dateObj.getFullYear()}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="modal-status ${sc}" id="mstat">${st}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>`;

  renderModalBody();
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderModalBody() {
  const ct = totalPool - FAC_CONFIG.filter(f => f.key !== 'ct').reduce((s, f) => s + (modalEdits[f.key] || 0), 0);
  const pct = Math.max(0, Math.min(ct / totalPool * 100, 100));
  const bc = ct < 0 ? 'var(--red)' : ct === 0 ? 'var(--amber)' : 'var(--green)';
  const ro = !adminUnlocked;

  const cards = FAC_CONFIG.filter(f => f.key !== 'ct').map(f => {
    const count = modalEdits[f.key] || 0;
    if (count === 0 && ro) return '';
    const task = (modalEdits.tasks && modalEdits.tasks[f.key]) || '';
    let body = '';
    if (f.key === 't1' && count > 0) {
      body = `<div class="fac-card-body"><div class="info-pill info-amber">⚠ See supervisor for T1 task details</div></div>`;
    } else if (ro) {
      body = task ? `<div class="fac-card-body"><div class="task-lbl">TASK</div><div class="task-text">${task}</div></div>` : '';
    } else {
      body = `<div class="fac-card-body">
        <div class="task-lbl">TASK</div>
        <textarea class="task-input" rows="2" onchange="modalEdits.tasks['${f.key}']=this.value">${task}</textarea>
      </div>`;
    }
    const cd = ro
      ? `<div class="fac-count-big" style="color:${f.color}">${count}</div>`
      : `<div class="count-ctrl">
          <button class="ctrl-btn" onclick="adjFac('${f.key}',-1)">&#8722;</button>
          <div class="ctrl-num" id="cn_${f.key}" contenteditable="true" spellcheck="false"
            oninput="modalEdits['${f.key}']=parseInt(this.textContent.replace(/\\D/g,''))||0;refreshBal()"
            onblur="this.textContent=modalEdits['${f.key}']||0">${count}</div>
          <button class="ctrl-btn" onclick="adjFac('${f.key}',1)">+</button>
        </div>`;
    return `<div class="fac-card">
      <div class="fac-card-hdr">
        <div class="fac-name-row"><div class="fac-pip" style="background:${f.color}"></div><span style="color:${f.color}">${f.label}</span></div>
        ${cd}
      </div>${body}</div>`;
  }).filter(Boolean).join('');

  const editSection = ro
    ? `<div class="admin-note">ENABLE ADMIN MODE TO EDIT</div>`
    : `<div>
        <div class="notes-lbl">CHANGE NOTE (LOGGED)</div>
        <textarea class="notes-input" id="cnote" placeholder="e.g. Manager called — moving FHG to Friday…" rows="2"></textarea>
      </div>
      <div class="save-status" id="saveStatus"></div>
      <button class="btn-save" id="saveBtn" onclick="saveDay()">SAVE CHANGES</button>`;

  // Build arrivals section for modal
  const modalArrivals = ARRIVALS[activeDate] || [];
  const arrivalSection = modalArrivals.length > 0 ? `
    <div class="arrival-modal-section">
      <div class="arrival-modal-title">⬇ INCOMING PRODUCT TO CT</div>
      ${modalArrivals.map(a => `
        <div class="arrival-modal-item">
          <div class="arrival-modal-pip" style="background:${a.color}"></div>
          <span>${a.source} — Room ${a.room} product arriving</span>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('modalBody').innerHTML = `
    ${arrivalSection}
    ${cards}
    <div class="fac-card">
      <div class="fac-card-hdr">
        <div class="fac-name-row"><div class="fac-pip" style="background:var(--c-ct)"></div><span style="color:var(--c-ct)">CT — CENTRAL TRIM</span></div>
        <div class="fac-count-big" style="color:${bc}" id="ctlive">${ct}</div>
      </div>
    </div>
    <div class="balance-wrap">
      <div class="balance-hdr"><span>WORKERS ASSIGNED</span><span id="ballbl">${totalPool - ct} / ${totalPool}</span></div>
      <div class="balance-track"><div class="balance-fill" id="balfill" style="width:${pct}%;background:${bc}"></div></div>
    </div>
    ${editSection}`;
}

function adjFac(key, delta) {
  modalEdits[key] = Math.max(0, (modalEdits[key] || 0) + delta);
  const el = document.getElementById('cn_' + key);
  if (el) el.textContent = modalEdits[key];
  refreshBal();
}

function refreshBal() {
  const ct = totalPool - FAC_CONFIG.filter(f => f.key !== 'ct').reduce((s, f) => s + (modalEdits[f.key] || 0), 0);
  const pct = Math.max(0, Math.min(ct / totalPool * 100, 100));
  const col = ct < 0 ? 'var(--red)' : ct === 0 ? 'var(--amber)' : 'var(--green)';
  const e1 = document.getElementById('ctlive'), e2 = document.getElementById('balfill');
  const e3 = document.getElementById('ballbl'), e4 = document.getElementById('mstat');
  if (e1) { e1.textContent = ct; e1.style.color = col; }
  if (e2) { e2.style.width = pct + '%'; e2.style.background = col; }
  if (e3) e3.textContent = `${totalPool - ct} / ${totalPool}`;
  if (e4) {
    e4.textContent = ct < 0 ? `OVER BY ${Math.abs(ct)}` : ct === 0 ? 'EXACT — CT CLOSED' : `CT: ${ct} AVAIL`;
    e4.className = 'modal-status ' + (ct < 0 ? 'over' : ct === 0 ? 'exact' : 'ok');
  }
}

async function saveDay() {
  const ds = activeDate;
  const old = scheduleData[ds];
  const note = (document.getElementById('cnote') || {}).value || '';
  const saveBtn = document.getElementById('saveBtn');
  const saveStatus = document.getElementById('saveStatus');

  const changes = [];
  FAC_CONFIG.filter(f => f.key !== 'ct').forEach(f => {
    const ov = old[f.key] || 0, nv = modalEdits[f.key] || 0;
    if (ov !== nv) changes.push({ fac: f.label, old: ov, new: nv, isTask: false });
    const ot = (old.tasks && old.tasks[f.key]) || '';
    const nt = (modalEdits.tasks && modalEdits.tasks[f.key]) || '';
    if (ot !== nt) changes.push({ fac: f.label + ' TASK', old: ot || '—', new: nt || '—', isTask: true });
  });

  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'SAVING…'; }
  if (saveStatus) saveStatus.style.color = 'var(--text-muted)';

  try {
    // Recalc CT
    modalEdits.ct = totalPool - FAC_CONFIG.filter(f => f.key !== 'ct').reduce((s, f) => s + (modalEdits[f.key] || 0), 0);

    // Save to Supabase
    await saveScheduleRow(ds, modalEdits);

    // Save change log
    if (changes.length > 0 || note.trim()) {
      const dateObj = new Date(ds + 'T12:00:00');
      await saveChangeLogEntry({
        date_iso: ds,
        date: `${MONTHS_LABEL[dateObj.getMonth()]} ${dateObj.getDate()}`,
        changes: changes.length > 0 ? changes : [{ fac: 'NOTE', old: '', new: note }],
        note: note.trim()
      });
    }

    // Update local state
    scheduleData[ds] = JSON.parse(JSON.stringify(modalEdits));

    if (saveStatus) { saveStatus.textContent = '✓ SAVED'; saveStatus.style.color = 'var(--green)'; }
    setTimestamp();

    setTimeout(() => {
      closeModal();
      buildCalendar(currentMonth);
      fetchChangeLog(currentMonth).then(log => { changeLog = log; renderLog(); });
    }, 600);

  } catch(e) {
    console.error('Save failed:', e);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'SAVE CHANGES'; }
    if (saveStatus) { saveStatus.textContent = '✗ SAVE FAILED — CHECK CONNECTION'; saveStatus.style.color = 'var(--red)'; }
  }
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  activeDate = null;
}
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// ── POOL ──
document.getElementById('poolMinus').addEventListener('click', () => {
  if (totalPool > 1) { totalPool--; document.getElementById('poolDisplay').textContent = totalPool; saveSetting('pool_size', totalPool); buildCalendar(currentMonth); }
});
document.getElementById('poolPlus').addEventListener('click', () => {
  totalPool++; document.getElementById('poolDisplay').textContent = totalPool; saveSetting('pool_size', totalPool); buildCalendar(currentMonth);
});
document.getElementById('poolDisplay').addEventListener('input', function() {
  const v = parseInt(this.textContent.replace(/\D/g, ''));
  if (!isNaN(v) && v > 0) { totalPool = v; saveSetting('pool_size', totalPool); buildCalendar(currentMonth); }
});
document.getElementById('poolDisplay').addEventListener('blur', function() { this.textContent = totalPool; });

// ── CHANGE LOG ──
function renderLog() {
  const cnt = changeLog.length;
  document.getElementById('logCount').textContent = cnt;
  const empty = document.getElementById('logEmpty');
  const entries = document.getElementById('logEntries');
  if (cnt === 0) { empty.style.display = 'block'; entries.innerHTML = ''; return; }
  empty.style.display = 'none';
  entries.innerHTML = changeLog.map(e => {
    const ch = e.changes.map(c => {
      if (c.isTask) return `<div class="log-task">${c.fac}: "${c.old}" → "${c.new}"</div>`;
      const arr = c.new > c.old ? '↑' : '↓';
      const col = c.new > c.old ? 'var(--amber)' : 'var(--blue)';
      return `<div class="log-change" style="color:${col}">${c.fac}: ${c.old} ${arr} ${c.new}</div>`;
    }).join('');
    return `<div class="log-entry">
      <div class="log-entry-top"><div class="log-edate">${e.date}</div><div class="log-ts">${e.ts}</div></div>
      ${ch}
      ${e.note ? `<div class="log-note">"${e.note}"</div>` : ''}
    </div>`;
  }).join('');
}
document.getElementById('logToggle').addEventListener('click', () => {
  logOpen = !logOpen;
  document.getElementById('logPanel').classList.toggle('open', logOpen);
  document.getElementById('logArrow').classList.toggle('open', logOpen);
});

// ── ADMIN ──
document.getElementById('adminBtn').addEventListener('click', () => {
  if (adminUnlocked) { adminUnlocked = false; updAdmin(); } else { openPin('unlock'); }
});
function updAdmin() {
  const btn = document.getElementById('adminBtn');
  const lbl = document.getElementById('adminBtnLabel');
  const pb = document.getElementById('poolBlock');
  btn.classList.toggle('active', adminUnlocked);
  lbl.textContent = adminUnlocked ? 'ADMIN ON — TAP TO LOCK' : 'ADMIN MODE';
  pb.classList.toggle('unlocked', adminUnlocked);
  buildCalendar(currentMonth);
}

// ── PIN ──
function openPin(mode) {
  pmode = mode; pbuf = ''; pnew = '';
  updDots(0, false);
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinTitle').textContent = mode === 'unlock' ? 'ADMIN' : 'CHANGE PIN';
  document.getElementById('pinSub').textContent = mode === 'unlock' ? 'ENTER PIN TO UNLOCK EDITING' : 'ENTER CURRENT PIN';
  document.getElementById('pinOverlay').classList.add('open');
}
function closePinOverlay() { document.getElementById('pinOverlay').classList.remove('open'); pbuf = ''; }
function updDots(n, err) {
  for (let i = 0; i < 4; i++) {
    document.getElementById('pd' + i).className = 'pin-dot' + (err ? ' error' : i < n ? ' filled' : '');
  }
}
function pinPress(d) {
  if (pbuf.length >= 4) return;
  pbuf += d; updDots(pbuf.length, false);
  document.getElementById('pinError').textContent = '';
  if (pbuf.length === 4) setTimeout(handlePin, 150);
}
function pinDel() { if (pbuf.length > 0) { pbuf = pbuf.slice(0, -1); updDots(pbuf.length, false); } }
async function handlePin() {
  if (pmode === 'unlock') {
    if (pbuf === adminPin) { adminUnlocked = true; closePinOverlay(); updAdmin(); }
    else pinErr('INCORRECT PIN');
    return;
  }
  if (pmode === 'change_verify') {
    if (pbuf === adminPin) { pmode = 'change_new'; pbuf = ''; updDots(0, false); document.getElementById('pinSub').textContent = 'ENTER NEW PIN'; }
    else pinErr('INCORRECT PIN');
    return;
  }
  if (pmode === 'change_new') {
    pnew = pbuf; pmode = 'change_confirm'; pbuf = ''; updDots(0, false);
    document.getElementById('pinSub').textContent = 'CONFIRM NEW PIN';
    return;
  }
  if (pmode === 'change_confirm') {
    if (pbuf === pnew) {
      adminPin = pbuf;
      await saveSetting('admin_pin', adminPin);
      closePinOverlay();
      const l = document.getElementById('adminBtnLabel');
      l.textContent = 'PIN SAVED ✓';
      setTimeout(() => { l.textContent = adminUnlocked ? 'ADMIN ON — TAP TO LOCK' : 'ADMIN MODE'; }, 2000);
    } else { pinErr('PINS DO NOT MATCH'); pmode = 'change_new'; }
  }
}
function pinErr(m) {
  pbuf = ''; updDots(4, true);
  document.getElementById('pinError').textContent = m;
  setTimeout(() => { updDots(0, false); document.getElementById('pinError').textContent = ''; }, 900);
}
function startChangePin() {
  openPin('change_verify');
  document.getElementById('pinTitle').textContent = 'CHANGE PIN';
  document.getElementById('pinSub').textContent = 'ENTER CURRENT PIN';
}

document.addEventListener('keydown', e => {
  const pinOpen = document.getElementById('pinOverlay').classList.contains('open');
  if (pinOpen) {
    if (e.key >= '0' && e.key <= '9') pinPress(e.key);
    else if (e.key === 'Backspace') pinDel();
    else if (e.key === 'Escape') closePinOverlay();
    return;
  }
  if (e.key === 'Escape') closeModal();
});

init();
</script>
</body>
